<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title">
  <title id="title">U-Card logo</title>
  <defs>
    <radialGradient id="felt" cx="50%" cy="35%" r="75%">
      <stop offset="0" stop-color="#1a8a4a"/>
      <stop offset="0.6" stop-color="#0f5c30"/>
      <stop offset="1" stop-color="#06341b"/>
    </radialGradient>
    <linearGradient id="back-blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f6fe4"/>
      <stop offset="1" stop-color="#1b3f8f"/>
    </linearGradient>
    <linearGradient id="back-red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3434f"/>
      <stop offset="1" stop-color="#9c1c28"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef0f3"/>
    </linearGradient>
    <pattern id="lattice" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 9H18M9 0V18" stroke="#ffffff" stroke-opacity="0.28" stroke-width="2.5"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <path id="heart" d="M50 88C22 66 6 50 6 32C6 18 17 8 29 8C39 8 46 14 50 22C54 14 61 8 71 8C83 8 94 18 94 32C94 50 78 66 50 88Z"/>
    <path id="diamond" d="M50 4L86 50L50 96L14 50Z"/>
    <path id="spade" d="M50 6C78 30 94 46 94 62C94 76 83 84 72 84C63 84 56 79 52 72C53 82 57 90 64 95H36C43 90 47 82 48 72C44 79 37 84 28 84C17 84 6 76 6 62C6 46 22 30 50 6Z"/>
    <g id="club">
      <circle cx="50" cy="28" r="20"/>
      <circle cx="27" cy="60" r="20"/>
      <circle cx="73" cy="60" r="20"/>
      <path d="M46 56C46 76 42 88 34 95H66C58 88 54 76 54 56Z"/>
    </g>

    <g id="card-back-blue">
      <rect x="-90" y="-130" width="180" height="260" rx="18" fill="#ffffff"/>
      <rect x="-78" y="-118" width="156" height="236" rx="10" fill="url(#back-blue)"/>
      <rect x="-78" y="-118" width="156" height="236" rx="10" fill="url(#lattice)"/>
    </g>
    <g id="card-back-red">
      <rect x="-90" y="-130" width="180" height="260" rx="18" fill="#ffffff"/>
      <rect x="-78" y="-118" width="156" height="236" rx="10" fill="url(#back-red)"/>
      <rect x="-78" y="-118" width="156" height="236" rx="10" fill="url(#lattice)"/>
    </g>
  </defs>

  <!-- Table felt -->
  <rect width="512" height="512" rx="104" fill="url(#felt)"/>
  <rect x="18" y="18" width="476" height="476" rx="88" fill="none" stroke="#f5c542" stroke-opacity="0.55" stroke-width="4"/>

  <!-- Fanned hand of cards -->
  <g transform="translate(256 248)">
    <g filter="url(#shadow)" transform="rotate(-20 0 170)">
      <use href="#card-back-blue"/>
    </g>
    <g filter="url(#shadow)" transform="rotate(20 0 170)">
      <use href="#card-back-red"/>
    </g>

    <g filter="url(#shadow)">
      <rect x="-90" y="-130" width="180" height="260" rx="18" fill="url(#face)" stroke="#d5d9e0" stroke-width="2"/>

      <!-- Corner indices -->
      <text x="-66" y="-88" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="700" fill="#d12a3a" text-anchor="middle">U</text>
      <use href="#heart" transform="translate(-79 -80) scale(0.26)" fill="#d12a3a"/>
      <g transform="rotate(180)">
        <text x="-66" y="-88" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="700" fill="#d12a3a" text-anchor="middle">U</text>
        <use href="#heart" transform="translate(-79 -80) scale(0.26)" fill="#d12a3a"/>
      </g>

      <!-- Big centre letter -->
      <text x="0" y="40" font-family="Georgia, 'Times New Roman', serif" font-size="150" font-weight="700" fill="#d12a3a" text-anchor="middle">U</text>

      <!-- The four suits used in the game -->
      <g transform="translate(-51 64) scale(0.22)">
        <use href="#spade" fill="#1f2430"/>
        <use href="#heart" x="120" fill="#d12a3a"/>
        <use href="#club" x="240" fill="#1f2430"/>
        <use href="#diamond" x="360" fill="#d12a3a"/>
      </g>
    </g>
  </g>
</svg>
